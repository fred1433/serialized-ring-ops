services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ring
      POSTGRES_PASSWORD: ring
      POSTGRES_DB: ring_ops
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ring -d ring_ops"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: serialized-ring-ops
    command: npm start
    environment:
      DATABASE_URL: postgres://ring:ring@db:5432/ring_ops
      PORT: "4104"
    ports:
      - "127.0.0.1:4104:4104"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    image: serialized-ring-ops
    profiles: ["proof"]
    command: npm test
    environment:
      DATABASE_URL: postgres://ring:ring@db:5432/ring_tests
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  race:
    build: .
    image: serialized-ring-ops
    profiles: ["proof"]
    command: npm run race
    environment:
      DATABASE_URL: postgres://ring:ring@db:5432/ring_race
    volumes:
      - ./reports:/app/reports
      - ./.git:/app/.git:ro
    depends_on:
      db:
        condition: service_healthy
